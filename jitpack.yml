jdk:
  - openjdk17
before_install:
  - git submodule update --init --recursive
  - if [ -d "/opt/android-sdk-linux/platforms/android-37.0" ] && [ ! -d "/opt/android-sdk-linux/platforms/android-37" ]; then ln -s /opt/android-sdk-linux/platforms/android-37.0 /opt/android-sdk-linux/platforms/android-37; fi
  - if [ -d "/opt/android-sdk-linux/platforms/android-37" ] && [ ! -d "/opt/android-sdk-linux/platforms/android-37.0" ]; then ln -s /opt/android-sdk-linux/platforms/android-37 /opt/android-sdk-linux/platforms/android-37.0; fi
install:
  - ./gradlew :wolfssl:publishToMavenLocal
