plugins {
    id 'com.android.library'
    id 'maven-publish'
}

group = 'com.github.UsagiApp'
version = System.getenv("LIB_VERSION") ?: '1.0.0'

android {
    namespace 'org.draken.wolfssl'
    compileSdk 37

    defaultConfig {
        minSdk 21
        targetSdk 37

        consumerProguardFiles 'consumer-rules.pro'

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.github.UsagiApp'
                artifactId = 'wolfssl'
                version = System.getenv("LIB_VERSION") ?: '1.0.0'
            }
        }
        repositories {
            maven {
                name = "GitHubPackages"
                url = uri("https://maven.pkg.github.com/UsagiApp/wolfSSL-android")
                credentials {
                    username = System.getenv("GITHUB_ACTOR") ?: ""
                    password = System.getenv("GITHUB_TOKEN") ?: ""
                }
            }
        }
    }
}
